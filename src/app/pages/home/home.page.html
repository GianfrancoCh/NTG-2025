<ion-header [translucent]="true" class="header-fix">
  <ion-toolbar>
    <!-- <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons> -->
    <ion-buttons slot="end">
      <ion-button *ngIf="user" class="boton-logout" (click)="logout()">
        <ion-icon name="exit-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="titulo-header">Pagina principal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content">
  <div class="container">
    <div *ngIf="!user">
      <h1 class="titulo-inicio">Bienvenido</h1>
      <p class="descripcion-inicio">Debes estar registrado para poder utilizar la app.</p>

      <ion-button size="big" (click)="goToLogin()">Iniciar Sesión</ion-button>
      <ion-button size="big" (click)="goToRegister()">Crear una Cuenta</ion-button>
    </div>

    <div *ngIf="user">
      <h1 class="titulo-inicio">¡Hola, {{ user.email }}!</h1>
      <!-- JEFE -->
      <div *ngIf="user && this.usuarioActual?.rol == 'jefe'">
        <ion-button size="big" routerLink="/lista-clientes-pendientes">Lista clientes pendientes</ion-button>
      </div>
      <!-- EMPLEADO -->
      <div
        *ngIf="user && (this.usuarioActual?.rol == 'empleado' || this.usuarioActual?.rol == 'cocinero' || this.usuarioActual?.rol == 'mozo' || this.usuarioActual?.rol == 'bartender' || this.usuarioActual?.rol == 'maitre')">
        <ion-button size="big" routerLink="/login">boton empleado</ion-button>
      </div>
      <!-- mozo cocinero bartender-->
      <div
        *ngIf="user && (this.usuarioActual?.rol == 'cocinero' || this.usuarioActual?.rol == 'mozo' || this.usuarioActual?.rol == 'bartender')">
        <ion-button size="big" routerLink="/lista-pedidos-pendiente">Pedidos pendientes</ion-button>
      </div>
      <!-- maitre -->
      <div *ngIf="user && this.usuarioActual?.rol == 'maitre'">
        <ion-button size="big" routerLink="/lista-espera">Lista de clientes en espera</ion-button>
      </div>
      <!-- CLIENTE -->
      <div *ngIf="user && this.usuarioActual?.rol == 'cliente'">
        <ion-button size="big" routerLink="/login">boton ej cliente</ion-button>
      </div>
    </div>

    <!-- OPCIONES USUARIOS -->

  </div>

  <!-- Reemplazo del ion-footer por div -->
  <div class="qr-container">
    <ion-button (click)="this.escanearQr()" fill="outline" class="btn_qr">
      <img src="../../../assets/qr.png" class="img_qr">
    </ion-button>
  </div>
</ion-content>
