<ion-header [translucent]="true" class="header-fix">
  <ion-toolbar color="primary"
    style="background-color:#039be6;color:black;height:70px;display:flex;align-items:center;justify-content:center;">
    <ion-buttons slot="start">
      <ion-back-button routerLink="/home"></ion-back-button>
    </ion-buttons>
    <ion-title style="font-size:2rem;">Encuestas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container background-pri">
    <ion-card style="width:95%;">
      <!-- <ion-card-header>
        <ion-card-title>Todas las encuestas</ion-card-title>
      </ion-card-header> -->

      <ion-card-content>
        <div class="encuestas-wrapper">
          <!-- ═════ Tarjeta por encuesta ═════ -->
          <ion-card class="encuesta-card" *ngFor="let enc of encuestas; trackBy: trackById"
            (click)="mostrarEncuesta(enc)">
            <div class="encuesta-row">
              <!-- FOTO + NOMBRE -->
              <div class="autor">
                <ion-avatar>
                  <img [src]="enc.autor.foto_url || defaultAvatar" alt="avatar cliente" />
                </ion-avatar>

                <div class="info">
                  <ion-label class="nombre">
                    {{ enc.autor.nombre }} {{ enc.autor.apellido }}
                  </ion-label>
                  <ion-label class="fecha">
                    {{ enc.fecha | date:'dd/MM/yyyy · HH:mm' }}
                  </ion-label>
                </div>
              </div>

              <!-- ESTRELLAS -->
              <div class="rating">
                <ion-icon *ngFor="let _ of stars; let i = index"
                  [name]="i < rating(enc) ? 'star' : 'star-outline'"></ion-icon>
              </div>
            </div>
          </ion-card>

          <!-- Sin encuestas -->
          <ion-card *ngIf="encuestas.length === 0" class="encuesta-card vacio">
            <ion-card-content class="texto-vacio">
              No has enviado encuestas todavía.
            </ion-card-content>
          </ion-card>
        </div>
      </ion-card-content>
    </ion-card>
    <div class="btns" style="margin-top:1.2rem;">
      <ion-button size="large" class="ion-margin" fill="solid" color="secondary" routerLink="/grafico-clientes">
        <ion-icon slot="icon-only" name="stats-chart"></ion-icon>
      </ion-button>

      <ion-button size="large" class="ion-margin" fill="solid" color="primary" routerLink="/home">
        <ion-icon slot="icon-only" name="home"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
