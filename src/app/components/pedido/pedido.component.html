<div style="height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem">
  <div style="max-height: 50vh; overflow: auto; width: 100%">
    <!-- Tabla con el pedido -->
    <table *ngIf="pedido.length > 0; else sinPedido">
      <thead>
        <tr>
          <th id="cant">Cantidad</th>
          <th id="nombre">Producto</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let prodCant of pedido; track $index">
          <td>{{ prodCant.cantidad }}</td>
          <td>{{ prodCant.producto.nombre }}</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td class="total-label">Tiempo</td>
          <td class="total-tiempo">{{ tiempoEst }}'</td>
        </tr>
      </tfoot>
    </table>

    <!-- Botón confirmar (solo cliente) -->
    <ion-button
      *ngIf="auth.UsuarioEnSesion?.rol === 'cliente'"
      size="large"
      color="tertiary"
      expand="block"
      (click)="hacerPedido()"
      style="margin-top: 1rem"
    >
      Confirmar pedido
    </ion-button>

    <!-- Sin pedido -->
    <ng-template #sinPedido>
      <p style="text-align: center; font-size: 18px; margin-top: 2rem">
        Todavía no cargó ningún producto a su pedido
      </p>
    </ng-template>
  </div>
</div>
